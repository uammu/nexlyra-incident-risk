name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt && pip install -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Audit pinned training dependencies
        run: |
          pip install pip-audit
          if [ -f requirements.lock ]; then pip-audit -r requirements.lock --no-deps --disable-pip; fi

  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t incident-risk-api .
      - name: Smoke test (no model mounted, so alive but not ready)
        run: |
          docker run -d --name api -p 8000:8000 incident-risk-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)
          [ "$code" = "503" ] || { echo "expected 503, got $code"; exit 1; }
          curl -sf localhost:8000/metrics/ | grep -q risk_model_loaded
          docker logs api
      - name: Vulnerability scan of what actually shipped
        run: |
          pip install pip-audit
          docker run --rm --entrypoint pip incident-risk-api freeze --exclude-editable > frozen.txt
          pip-audit -r frozen.txt --no-deps --disable-pip
      - if: always()
        run: docker rm -f api || true